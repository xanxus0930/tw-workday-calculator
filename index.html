<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作日計算器｜台灣國定假日</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #ffffff;
  --panel:    #f9fafb;
  --card:     #f3f4f6;
  --border:   #e5e7eb;
  --border2:  #d1d5db;
  --accent:   #f59e0b;
  --accent-d: #b45309;
  --on-accent:#422006;
  --text:     #1f2937;
  --muted:    #9ca3af;
  --muted2:   #6b7280;
  --holiday:  #e11d48;
  --weekend:  #4f46e5;
  --success:  #059669;
  --r:        7px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
  font-size: 13px;
  line-height: 1.5;
  min-height: 100vh;
  display: flex;
}

.layout { display: flex; flex: 1; width: 100%; }

.sidebar {
  width: 248px;
  min-width: 220px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex-shrink: 0;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.logo h1 { font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: -.02em; }
.logo h1 span { color: var(--accent-d); }
.logo p  { font-size: 11px; color: var(--muted2); margin-top: 1px; }

.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.tab {
  padding: 6px 4px;
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  text-align: center;
  border: 1px solid var(--border);
  border-radius: var(--r);
  background: none;
  color: var(--muted2);
  cursor: pointer;
  transition: all .15s;
}
.tab.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.tab:hover:not(.active) { border-color: var(--border2); color: var(--text); }

.lbl {
  display: block;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 5px;
}

.date-row { display: flex; gap: 4px; }
.date-row input { flex: 1; min-width: 0; }
.qd-col { display: flex; flex-direction: column; gap: 3px; }
.btn-qd {
  font-family: inherit;
  font-size: 10px;
  font-weight: 600;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--muted2);
  padding: 3px 7px;
  border-radius: 5px;
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s;
  line-height: 1.4;
}
.btn-qd:hover, .btn-qd.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

input[type="date"],
input[type="number"] {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  padding: 6px 9px;
  outline: none;
  transition: border-color .15s;
  -webkit-appearance: none;
}
input:focus { border-color: var(--accent); }

.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
.seg-btn {
  font-family: inherit;
  font-size: 11px;
  font-weight: 500;
  padding: 6px 4px;
  text-align: center;
  background: none;
  border: none;
  color: var(--muted2);
  cursor: pointer;
  transition: all .15s;
}
.seg-btn + .seg-btn { border-left: 1px solid var(--border); }
.seg-btn.active { background: var(--card); color: var(--accent-d); font-weight: 700; }
.seg-btn:hover:not(.active) { background: var(--card); color: var(--text); }

.chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; }
.chip {
  font-family: inherit;
  font-size: 10px;
  font-weight: 600;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--muted2);
  padding: 3px 8px;
  border-radius: 999px;
  cursor: pointer;
  transition: all .15s;
}
.chip:hover, .chip.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip-tool { border-style: dashed; color: var(--muted2); }
.chip-tool:hover { background: var(--card); border-color: var(--border2); color: var(--text); }
.chip-x { margin-left: 4px; color: var(--holiday); font-weight: 800; cursor: pointer; }
.chip.active .chip-x { color: var(--on-accent); }
.chip-input-wrap { display: inline-flex; gap: 3px; align-items: center; }
.chips .chip-input-wrap input { width: 56px; padding: 3px 7px; font-size: 11px; }

.main {
  flex: 1;
  overflow-y: auto;
  padding: 18px 20px 24px;
  min-width: 0;
}

.cal-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.cal-range-label { font-size: 13px; font-weight: 600; color: var(--text); }
.cal-nav-btns { display: flex; gap: 4px; }
.cal-nav-btn {
  width: 26px; height: 26px;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--muted2);
  border-radius: 5px;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.cal-nav-btn:hover { border-color: var(--accent); color: var(--accent-d); }

.month-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 12px;
}

.cal-month-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted2);
  margin-bottom: 6px;
  letter-spacing: .02em;
}

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}
.cal-grid > div { background: var(--bg); }

.cal-dow {
  text-align: center;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .04em;
  color: var(--muted);
  padding: 2px 0 5px;
}
.cal-dow.is-sun { color: var(--holiday); }
.cal-dow.is-sat { color: var(--weekend); }

.cal-cell {
  position: relative;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 0;
  font-size: 12px;
  font-weight: 500;
  color: var(--text);
  cursor: pointer;
  transition: background .1s;
  user-select: none;
}
.cal-cell:hover { background: var(--card); }
.cal-cell.is-today { font-weight: 700; }
.cal-cell.is-today::before {
  content: '';
  position: absolute;
  bottom: 2px;
  width: 3px; height: 3px;
  background: var(--accent);
  border-radius: 50%;
}
.cal-cell.is-weekend { color: var(--weekend); }
.cal-cell.is-holiday { color: var(--holiday); }
.cal-cell.is-holiday::after {
  content: attr(data-hname);
  position: absolute;
  bottom: 1px;
  left: 0; right: 0;
  font-size: 8px;
  color: var(--holiday);
  opacity: .8;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: center;
  padding: 0 1px;
}
.cal-cell.is-start {
  background: rgba(245,158,11,.20);
  color: var(--accent-d);
  font-weight: 700;
}
.cal-cell.in-range {
  background: rgba(245,158,11,.10);
}
.cal-cell.is-result {
  background: var(--accent) !important;
  color: var(--on-accent) !important;
  font-weight: 800 !important;
  border-radius: 50% !important;
}

.day-num-badge {
  position: absolute;
  top: 2px;
  right: 2px;
  font-size: 9px;
  font-weight: 700;
  color: var(--accent-d);
  background: rgba(245,158,11,.18);
  border-radius: 3px;
  padding: 0 2px;
  line-height: 1.55;
  letter-spacing: 0;
}
.cal-cell.is-result .day-num-badge { display: none; }

.legend {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 11px;
  color: var(--muted2);
  margin-bottom: 16px;
}
.legend-item { display: flex; align-items: center; gap: 4px; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.dot.acc { background: var(--accent); }
.dot.hol { background: var(--holiday); }
.dot.wkd { background: var(--weekend); }
.badge-samp {
  display: inline-block;
  width: 16px; height: 12px;
  line-height: 1.45;
  background: rgba(245,158,11,.18);
  border-radius: 3px;
  font-size: 9px;
  font-weight: 700;
  color: var(--accent-d);
  text-align: center;
  flex-shrink: 0;
}

.result-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px 16px;
  margin-bottom: 10px;
  animation: fadeUp .28s ease both;
}
.result-from { font-size: 11px; color: var(--muted2); margin-bottom: 3px; }
.result-big  { font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 700; color: var(--accent-d); letter-spacing: -.02em; line-height: 1.1; }
.result-sub  { font-size: 11px; color: var(--muted2); margin-top: 2px; }

.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
  margin-bottom: 10px;
  animation: fadeUp .28s .05s ease both;
}
.stat {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 9px 11px;
}
.stat-n { font-size: 1.25rem; font-weight: 700; line-height: 1.1; color: var(--text); }
.stat-n.acc { color: var(--accent-d); }
.stat-n.hol { color: var(--holiday); }
.stat-n.wkd { color: var(--weekend); }
.stat-l { font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-top: 3px; }

.share-bar {
  display: flex;
  gap: 6px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  animation: fadeUp .28s .1s ease both;
}
.share-input {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  color: var(--muted2);
  font-family: inherit;
  font-size: 11px;
  padding: 6px 9px;
  outline: none;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.btn-copy {
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 11px;
  border-radius: var(--r);
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.btn-copy:hover { border-color: var(--accent); color: var(--accent-d); }
.btn-copy.ok    { border-color: var(--success); color: var(--success); }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (max-width: 900px) {
  .month-grid { grid-template-columns: 1fr; }
}
@media (max-width: 700px) {
  .layout { flex-direction: column; }
  .sidebar { width: 100%; height: auto; position: static; border-right: none; border-bottom: 1px solid var(--border); }
  .main { padding: 14px 14px 40px; }
  .stats-row { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<div class="layout">

  <aside class="sidebar">

    <div class="logo">
      <h1>工作日<span>計算器</span></h1>
      <p>🇹🇼 含台灣國定假日（自動排除週末／假日）</p>
    </div>

    <div class="tabs">
      <button class="tab active" id="tab-calc"  onclick="setMode('calc')">📅 算到期日</button>
      <button class="tab"        id="tab-count" onclick="setMode('count')">🔢 算天數</button>
    </div>

    <div id="panel-calc">
      <div style="margin-bottom:10px">
        <span class="lbl">起始日期 <em style="font-style:normal;font-size:9px;color:var(--accent-d);font-weight:700;letter-spacing:0;text-transform:none">← 可點行事曆選</em></span>
        <div class="date-row">
          <input type="date" id="calc-start" onchange="clearQD();autoCalc()">
          <div class="qd-col">
            <button class="btn-qd" id="qd-today"    onclick="setToday()">今天</button>
            <button class="btn-qd" id="qd-tomorrow" onclick="setTomorrow()">明天</button>
          </div>
        </div>
      </div>

      <div style="margin-bottom:10px">
        <span class="lbl">計算方向</span>
        <div class="seg">
          <button class="seg-btn active" id="dir-after"  onclick="setDir('after')">往後推 →</button>
          <button class="seg-btn"        id="dir-before" onclick="setDir('before')">← 往前推</button>
        </div>
      </div>

      <div style="margin-bottom:8px">
        <span class="lbl">工作天數 <em style="font-style:normal;font-size:9px;color:var(--muted2);font-weight:600;letter-spacing:0;text-transform:none">（可直接輸入或自訂快選）</em></span>
        <input type="number" id="calc-days" min="1" max="9999" value="30" oninput="onDaysInput()">
        <div class="chips" id="chips-calc"></div>
      </div>
    </div>

    <div id="panel-count" style="display:none">
      <div style="margin-bottom:10px">
        <span class="lbl">起始日期 <em id="count-hint" style="font-style:normal;font-size:9px;color:var(--accent-d);font-weight:700;letter-spacing:0;text-transform:none">← 點行事曆選</em></span>
        <div class="date-row">
          <input type="date" id="count-start" onchange="countPhase=2;autoCalc()">
          <div class="qd-col">
            <button class="btn-qd" onclick="document.getElementById('count-start').value=todayISO();countPhase=2;autoCalc()">今天</button>
            <button class="btn-qd" onclick="document.getElementById('count-start').value=addDaysISO(todayISO(),1);countPhase=2;autoCalc()">明天</button>
          </div>
        </div>
      </div>
      <div style="margin-bottom:8px">
        <span class="lbl">結束日期</span>
        <div class="date-row">
          <input type="date" id="count-end" onchange="countPhase=2;autoCalc()">
          <div class="qd-col">
            <button class="btn-qd" onclick="document.getElementById('count-end').value=addDaysISO(todayISO(),30);countPhase=2;autoCalc()">+30天</button>
            <button class="btn-qd" onclick="document.getElementById('count-end').value=addDaysISO(todayISO(),90);countPhase=2;autoCalc()">+90天</button>
          </div>
        </div>
      </div>
    </div>

  </aside>

  <main class="main">

    <div class="cal-toolbar">
      <div class="cal-range-label" id="cal-range-label"></div>
      <div class="cal-nav-btns">
        <button class="cal-nav-btn" onclick="prevMonths()" title="上三個月">◀</button>
        <button class="cal-nav-btn" onclick="nextMonths()" title="下三個月">▶</button>
      </div>
    </div>

    <div class="month-grid" id="month-grid"></div>

    <div class="legend">
      <span class="legend-item"><span class="dot acc"></span> 起始／結果</span>
      <span class="legend-item"><span class="badge-samp">1</span> 工作天序號</span>
      <span class="legend-item"><span class="dot hol"></span> 國定假日</span>
      <span class="legend-item"><span class="dot wkd"></span> 週末</span>
    </div>

    <div id="result-area"></div>

  </main>

</div>

<script>
const TW_HOLIDAYS = {
  '2024-01-01':'元旦',
  '2024-02-08':'春節','2024-02-09':'春節','2024-02-10':'春節','2024-02-11':'春節',
  '2024-02-12':'春節','2024-02-13':'春節','2024-02-14':'春節',
  '2024-02-28':'和平紀念日',
  '2024-04-04':'兒童節/清明','2024-04-05':'清明節',
  '2024-05-01':'勞動節','2024-06-10':'端午節',
  '2024-09-17':'中秋節','2024-10-10':'國慶日',
  '2025-01-01':'元旦',
  '2025-01-27':'春節','2025-01-28':'春節','2025-01-29':'春節','2025-01-30':'春節',
  '2025-01-31':'春節','2025-02-01':'春節','2025-02-02':'春節',
  '2025-02-28':'和平紀念日',
  '2025-04-03':'兒童節','2025-04-04':'清明節',
  '2025-05-01':'勞動節','2025-05-30':'端午補假','2025-05-31':'端午節',
  '2025-10-06':'中秋節','2025-10-10':'國慶日',
  '2026-01-01':'元旦',
  '2026-02-17':'春節','2026-02-18':'春節','2026-02-19':'春節','2026-02-20':'春節',
  '2026-02-21':'春節','2026-02-22':'春節','2026-02-23':'春節',
  '2026-02-28':'和平紀念日','2026-04-04':'兒童節/清明',
  '2026-05-01':'勞動節','2026-06-19':'端午節',
  '2026-09-25':'中秋節','2026-10-10':'國慶日',
  '2027-01-01':'元旦',
  '2027-02-06':'春節','2027-02-07':'春節','2027-02-08':'春節','2027-02-09':'春節',
  '2027-02-10':'春節','2027-02-11':'春節','2027-02-12':'春節',
  '2027-02-28':'和平紀念日','2027-04-03':'兒童節','2027-04-05':'清明節',
  '2027-05-01':'勞動節','2027-06-09':'端午節',
  '2027-09-15':'中秋節','2027-10-10':'國慶日',
};

let mode = 'calc';
let dir  = 'after';
let calBaseYear, calBaseMonth;
let calcState  = null;
let countPhase = 0;

const DEFAULT_PRESETS = [1,3,5,7,10,14,30,60,90];
let presets   = loadPresets();
let editMode  = false;
let addingChip= false;

function loadPresets() {
  try { const s = JSON.parse(localStorage.getItem('wd_presets')); if (Array.isArray(s) && s.length) return s; } catch (e) {}
  return [...DEFAULT_PRESETS];
}
function savePresets() { try { localStorage.setItem('wd_presets', JSON.stringify(presets)); } catch (e) {} }

const todayISO  = () => toISO(new Date());
const toISO     = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseDate = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDaysISO= (iso,n) => { const d=parseDate(iso); d.setDate(d.getDate()+n); return toISO(d); };
const diffDays  = (a,b) => Math.round((parseDate(b)-parseDate(a))/86400000);
const isWeekend = d => [0,6].includes(d.getDay());
const isHoliday = d => !!TW_HOLIDAYS[toISO(d)];
const isWorkday = d => !isWeekend(d) && !isHoliday(d);

function addMonths(y, m, n) {
  m += n;
  while (m > 11) { m -= 12; y++; }
  while (m <  0) { m += 12; y--; }
  return [y, m];
}

const WD  = ['日','一','二','三','四','五','六'];
const MO  = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
const fmtDate = iso => {
  const d = parseDate(iso);
  return `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日（${WD[d.getDay()]}）`;
};

function init() {
  const now = new Date();
  calBaseYear  = now.getFullYear();
  calBaseMonth = now.getMonth();
  const t = todayISO();
  document.getElementById('calc-start').value  = t;
  document.getElementById('count-start').value = t;
  document.getElementById('count-end').value   = addDaysISO(t, 30);
  markQD(t);
  renderChips();
  refreshCalDisplay();
  const p = new URLSearchParams(location.search);
  if (p.get('start')) parseURL();
  else setTimeout(calculate, 60);
}

function refreshCalDisplay() {
  const [y1, m1] = [calBaseYear, calBaseMonth];
  const [y2, m2] = addMonths(y1, m1, 1);
  const [y3, m3] = addMonths(y1, m1, 2);
  document.getElementById('cal-range-label').textContent =
    `${y1} 年 ${MO[m1]} ～ ${y3} 年 ${MO[m3]}`;
  document.getElementById('month-grid').innerHTML =
    `<div>${buildMonthHTML(y1,m1)}</div><div>${buildMonthHTML(y2,m2)}</div><div>${buildMonthHTML(y3,m3)}</div>`;
}

function buildMonthHTML(year, month) {
  const today   = todayISO();
  const first   = new Date(year, month, 1);
  const startWD = (first.getDay() + 6) % 7;
  const dim     = new Date(year, month+1, 0).getDate();
  const rangeS  = calcState?.rangeS;
  const rangeE  = calcState?.rangeE;
  const hiStart = calcState?.hiStart;
  const hiEnd   = calcState?.hiEnd;
  const wdMap   = calcState?.wdMap || {};
  let cells = '';
  for (let i = 0; i < startWD; i++) cells += '<div></div>';
  const trail = (7 - ((startWD + dim) % 7)) % 7;
  for (let d = 1; d <= dim; d++) {
    const iso  = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const date = parseDate(iso);
    const dow  = date.getDay();
    const isWE = dow === 0 || dow === 6;
    const isHol= !!TW_HOLIDAYS[iso];
    const hn   = TW_HOLIDAYS[iso] || '';
    const isRes  = iso === hiEnd;
    const isSt   = iso === hiStart;
    const inRng  = rangeS && rangeE && iso > rangeS && iso < rangeE;
    const isTdy  = iso === today;
    const wdNum  = wdMap[iso];
    let cls = 'cal-cell';
    if (isRes)      cls += ' is-result';
    else if (isSt)  cls += ' is-start';
    else if (inRng) cls += ' in-range';
    if (!isRes && !isSt) {
      if (isHol)      cls += ' is-holiday';
      else if (isWE)  cls += ' is-weekend';
      else if (isTdy) cls += ' is-today';
    }
    const badge = (wdNum && !isRes) ? `<span class="day-num-badge">${wdNum}</span>` : '';
    const dattr = isHol ? ` data-hname="${hn}"` : '';
    cells += `<div class="${cls}"${dattr} onclick="pickDate('${iso}')">${badge}${d}</div>`;
  }
  for (let i = 0; i < trail; i++) cells += '<div></div>';
  return `
    <div class="cal-month-title">${year} 年 ${MO[month]}</div>
    <div class="cal-grid">
      <div class="cal-dow">一</div><div class="cal-dow">二</div><div class="cal-dow">三</div>
      <div class="cal-dow">四</div><div class="cal-dow">五</div>
      <div class="cal-dow is-sat">六</div><div class="cal-dow is-sun">日</div>
      ${cells}
    </div>`;
}

function prevMonths() { [calBaseYear, calBaseMonth] = addMonths(calBaseYear, calBaseMonth, -3); refreshCalDisplay(); }
function nextMonths() { [calBaseYear, calBaseMonth] = addMonths(calBaseYear, calBaseMonth,  3); refreshCalDisplay(); }

function pickDate(iso) {
  if (mode === 'calc') {
    document.getElementById('calc-start').value = iso;
    markQD(iso); autoCalc();
  } else {
    if (countPhase === 0 || countPhase === 2) {
      document.getElementById('count-start').value = iso;
      document.getElementById('count-end').value   = '';
      countPhase = 1;
      calcState  = { rangeS: iso, rangeE: iso, hiStart: iso, hiEnd: iso, wdMap: {} };
      refreshCalDisplay();
      document.getElementById('result-area').innerHTML = '';
    } else {
      const s = document.getElementById('count-start').value;
      if (iso >= s) { document.getElementById('count-end').value = iso; }
      else { document.getElementById('count-start').value = iso; document.getElementById('count-end').value = s; }
      countPhase = 2; autoCalc();
    }
  }
}

function setMode(m) {
  mode = m; countPhase = 0;
  document.getElementById('panel-calc').style.display  = m === 'calc'  ? '' : 'none';
  document.getElementById('panel-count').style.display = m === 'count' ? '' : 'none';
  document.getElementById('tab-calc').classList.toggle('active',  m === 'calc');
  document.getElementById('tab-count').classList.toggle('active', m === 'count');
}
function setDir(d) {
  dir = d;
  document.getElementById('dir-after').classList.toggle('active',  d === 'after');
  document.getElementById('dir-before').classList.toggle('active', d === 'before');
  autoCalc();
}
function setDays(n) { document.getElementById('calc-days').value = n; highlightChip(); autoCalc(); }
function onDaysInput() { highlightChip(); autoCalc(); }
function highlightChip() { if (!addingChip) renderChips(); }

function renderChips() {
  const cur = parseInt(document.getElementById('calc-days').value);
  let html = presets.map(n =>
    `<button class="chip${n===cur?' active':''}" onclick="setDays(${n})">${n}天${editMode?` <span class="chip-x" onclick="event.stopPropagation();removePreset(${n})">×</span>`:''}</button>`
  ).join('');
  if (addingChip) {
    html += `<span class="chip-input-wrap"><input type="number" id="preset-input" min="1" max="9999" placeholder="天數" onkeydown="if(event.key==='Enter')commitAddChip();if(event.key==='Escape')cancelAddChip()"><button class="chip chip-tool" onclick="commitAddChip()">✓</button></span>`;
  } else {
    html += `<button class="chip chip-tool" onclick="startAddChip()">＋ 自訂</button>`;
    html += `<button class="chip chip-tool" onclick="toggleEditChips()">${editMode?'完成':'編輯'}</button>`;
  }
  document.getElementById('chips-calc').innerHTML = html;
}
function startAddChip() { addingChip = true; editMode = false; renderChips(); document.getElementById('preset-input').focus(); }
function cancelAddChip() { addingChip = false; renderChips(); }
function commitAddChip() {
  const v = parseInt(document.getElementById('preset-input').value);
  addingChip = false;
  if (v > 0 && v <= 9999) {
    if (!presets.includes(v)) { presets.push(v); presets.sort((a,b)=>a-b); savePresets(); }
    setDays(v);
  } else { renderChips(); }
}
function removePreset(n) { presets = presets.filter(x => x !== n); savePresets(); renderChips(); }
function toggleEditChips() { editMode = !editMode; addingChip = false; renderChips(); }
function setToday()    { const t=todayISO();             document.getElementById('calc-start').value=t; markQD(t); autoCalc(); }
function setTomorrow() { const t=addDaysISO(todayISO(),1); document.getElementById('calc-start').value=t; markQD(t); autoCalc(); }
function clearQD() { markQD(document.getElementById('calc-start').value); }
function markQD(v) {
  const t=todayISO(), tm=addDaysISO(todayISO(),1);
  document.getElementById('qd-today').classList.toggle('active',    v===t);
  document.getElementById('qd-tomorrow').classList.toggle('active', v===tm);
}
function autoCalc() {
  if (mode === 'calc') { if (!document.getElementById('calc-start').value) return; }
  else { if (!document.getElementById('count-start').value || !document.getElementById('count-end').value) return; }
  calculate();
}

function countWorkdaysRange(s, e) {
  let wd=0, we=0, hol=0;
  const cur=parseDate(s), end=parseDate(e);
  while (cur<=end) {
    if (isHoliday(cur)) hol++;
    else if (isWeekend(cur)) we++;
    else wd++;
    cur.setDate(cur.getDate()+1);
  }
  return {wd,we,hol};
}
function findWorkdayEnd(startISO, n, direction) {
  const d=parseDate(startISO), step=direction==='after'?1:-1;
  let rem=n, we=0, hol=0;
  while (rem>0) {
    d.setDate(d.getDate()+step);
    if (isHoliday(d)) { hol++; continue; }
    if (isWeekend(d)) { we++;  continue; }
    rem--;
  }
  return { endISO: toISO(d), skippedWE: we, skippedHol: hol };
}
function buildWorkdayMap(s, e) {
  const map={}, cur=parseDate(s), end=parseDate(e); let idx=0;
  while (cur<=end) { if (isWorkday(cur)) { idx++; map[toISO(cur)]=idx; } cur.setDate(cur.getDate()+1); }
  return map;
}

function calculate() {
  if (mode === 'calc') {
    const startISO = document.getElementById('calc-start').value;
    const days = parseInt(document.getElementById('calc-days').value) || 0;
    if (!startISO || !days) return;
    const {endISO: resultISO, skippedWE: skWE, skippedHol: skHol} = findWorkdayEnd(startISO, days, dir);
    const [rangeS, rangeE] = startISO<=resultISO ? [startISO,resultISO] : [resultISO,startISO];
    const {wd,we,hol} = countWorkdaysRange(rangeS, rangeE);
    const totalCal = Math.abs(diffDays(startISO, resultISO));
    const wdMap = buildWorkdayMap(rangeS, rangeE);
    calcState = { rangeS, rangeE, hiStart: startISO, hiEnd: resultISO, wdMap };
    navigateTo(startISO);
    updateURL({ mode:'calc', start:startISO, days, dir });
    const label = (dir==='after'?'往後 ':'往前 ')+days+' 個工作天';
    renderCalcResult({ startISO, resultISO, label, wd, we: we+skWE, hol: hol+skHol, totalCal });
  } else {
    const startISO = document.getElementById('count-start').value;
    const endISO   = document.getElementById('count-end').value;
    if (!startISO || !endISO) return;
    const [rangeS, rangeE] = startISO<=endISO ? [startISO,endISO] : [endISO,startISO];
    const {wd,we,hol} = countWorkdaysRange(rangeS, rangeE);
    const totalCal = Math.abs(diffDays(rangeS, rangeE));
    const wdMap = buildWorkdayMap(rangeS, rangeE);
    calcState = { rangeS, rangeE, hiStart: rangeS, hiEnd: rangeE, wdMap };
    navigateTo(rangeS);
    updateURL({ mode:'count', start:rangeS, end:rangeE });
    renderCountResult({ rangeS, rangeE, display: wd, unit: '工作天', wd, we, hol, totalCal });
  }
}

function navigateTo(iso) {
  const d=parseDate(iso); calBaseYear=d.getFullYear(); calBaseMonth=d.getMonth(); refreshCalDisplay();
}

function renderCalcResult({ startISO, resultISO, label, wd, we, hol, totalCal }) {
  const isHol=isHoliday(parseDate(resultISO)), isWE=isWeekend(parseDate(resultISO));
  const warn = isHol ? ' <small style="font-size:.75rem;color:var(--holiday)">⚠ 假日</small>'
             : isWE  ? ' <small style="font-size:.75rem;color:var(--weekend)">⚠ 週末</small>' : '';
  document.getElementById('result-area').innerHTML = `
    <div class="result-card">
      <div class="result-from">${fmtDate(startISO)} ＋ ${label}</div>
      <div class="result-big">${resultISO.replace(/-/g,' / ')}${warn}</div>
      <div class="result-sub">${fmtDate(resultISO)}</div>
    </div>
    <div class="stats-row">
      <div class="stat"><div class="stat-n acc">${totalCal}</div><div class="stat-l">日曆天</div></div>
      <div class="stat"><div class="stat-n">${wd}</div><div class="stat-l">工作天</div></div>
      <div class="stat"><div class="stat-n hol">${hol}</div><div class="stat-l">假日</div></div>
      <div class="stat"><div class="stat-n wkd">${we}</div><div class="stat-l">週末</div></div>
    </div>
    ${shareBar()}`;
}
function renderCountResult({ rangeS, rangeE, display, unit, wd, we, hol, totalCal }) {
  document.getElementById('result-area').innerHTML = `
    <div class="result-card">
      <div class="result-from">${fmtDate(rangeS)} → ${fmtDate(rangeE)}</div>
      <div class="result-big">${display} <span style="font-size:1rem;font-weight:600">${unit}</span></div>
      <div class="result-sub">${rangeS} ～ ${rangeE}</div>
    </div>
    <div class="stats-row">
      <div class="stat"><div class="stat-n acc">${totalCal}</div><div class="stat-l">日曆天</div></div>
      <div class="stat"><div class="stat-n">${wd}</div><div class="stat-l">工作天</div></div>
      <div class="stat"><div class="stat-n hol">${hol}</div><div class="stat-l">假日</div></div>
      <div class="stat"><div class="stat-n wkd">${we}</div><div class="stat-l">週末</div></div>
    </div>
    ${shareBar()}`;
}
function shareBar() {
  return `<div class="share-bar">
    <input class="share-input" readonly value="${location.href}" onclick="this.select()">
    <button class="btn-copy" id="btn-copy" onclick="copyURL()">複製連結</button>
  </div>`;
}

function updateURL(params) {
  const p=new URLSearchParams();
  Object.entries(params).forEach(([k,v])=>p.set(k,v));
  history.replaceState(null,'','?'+p.toString());
}
function parseURL() {
  const p=new URLSearchParams(location.search);
  if (p.get('mode')==='count') setMode('count');
  if (p.get('dir'))   setDir(p.get('dir'));
  if (p.get('start')) { document.getElementById('calc-start').value=p.get('start'); document.getElementById('count-start').value=p.get('start'); markQD(p.get('start')); }
  if (p.get('days'))  { document.getElementById('calc-days').value=p.get('days'); highlightChip(); }
  if (p.get('end'))   document.getElementById('count-end').value=p.get('end');
  setTimeout(calculate, 80);
}
function copyURL() {
  navigator.clipboard?.writeText(location.href).catch(()=>{});
  const b=document.getElementById('btn-copy');
  b.textContent='已複製 ✓'; b.classList.add('ok');
  setTimeout(()=>{ b.textContent='複製連結'; b.classList.remove('ok'); }, 2200);
}
document.addEventListener('keydown', e => { if (e.key==='Enter') calculate(); });
init();
</script>
</body>
</html>
